name: Binance Radar Cloud

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-run

env:
  TZ: Asia/Shanghai
  MAIL_USER: ${{ secrets.MAIL_USER }}
  MAIL_PASS: ${{ secrets.MAIL_PASS }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
  WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run monitor
        run: python monitor.py
      - name: Commit state
        run: |
          git config user.name "binance-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state $(date +'%Y-%m-%d %H:%M')"
          git push
